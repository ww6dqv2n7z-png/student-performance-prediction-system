[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "student-performance-ann"
version = "2.1.0"
description = "Secure ANN pipeline for student performance prediction"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
  "tensorflow>=2.16,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
student-train = "student_performance.train:main"
student-predict = "student_performance.predict:main"
student-web-api = "student_performance.api:main"
student-experiment = "student_performance.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
